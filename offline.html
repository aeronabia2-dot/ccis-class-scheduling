<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline | CCIS Scheduling System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0A3524; --green-800:#0F4A31; --green-700:#146C43;
    --cream-50:#FBFEFC; --ink-900:#101B15; --ink-600:#47554c;
  }
  *{box-sizing:border-box}5
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Inter",-apple-system,"Segoe UI",sans-serif; color:var(--ink-900);
    background:linear-gradient(190deg,var(--green-900) 0%,var(--green-800) 45%,var(--cream-50) 45%);
    text-align:center; padding:24px;
  }
  .card{
    background:#fff; border-radius:16px; padding:44px 36px; max-width:420px; width:100%;
    box-shadow:0 24px 48px rgba(10,53,36,.16);
  }
  .icon{
    width:64px;height:64px;border-radius:14px;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    background:#E1F5EA;color:var(--green-700);font-size:1.6rem;
  }
  h1{ font-family:"Sora",sans-serif; font-weight:800; font-size:1.3rem; margin:0 0 10px; }
  p{ color:var(--ink-600); font-size:.95rem; line-height:1.55; margin:0 0 22px; }
  button{
    border:none; background:var(--green-700); color:#fff; font-weight:600; font-size:.92rem;
    padding:11px 22px; border-radius:10px; cursor:pointer; transition:background .15s ease;
  }
  button:hover{ background:var(--green-800); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-wifi"></i></div>
    <h1>You're offline</h1>
    <p>The CCIS Scheduling System can't reach the server right now. Check your connection and try again — any page you've already visited may still be available from cache.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
