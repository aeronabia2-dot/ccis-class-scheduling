<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CCIS Scheduling System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/core/style.css">
    <link rel="stylesheet" href="css/auth/login.css">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192.png">
    <link rel="stylesheet" href="css/core/notifications.css">
</head>
<body class="login-body">

    <div class="login-bg-image" style="background-image:url('images/branding/ccis-banner.jpg');"></div>
    <div class="login-bg-scrim"></div>

    <div class="login-shell">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-mark"><i class="fas fa-calendar-days"></i></span>
                <div>
                    <div class="login-brand-title">CCIS Scheduling</div>
                    <div class="login-brand-sub">Northwest Samar State University</div>
                </div>
            </div>

            <h1 class="login-heading">Sign in</h1>
            <p class="login-subheading">Enter your credentials to access the scheduling system.</p>

            <div class="login-alert" id="loginAlert" role="alert" hidden></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 login-submit" id="loginSubmit">
                    <span class="login-submit-text">Sign In</span>
                    <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth/login.js"></script>
</body>
</html>
